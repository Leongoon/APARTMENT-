name: Android APK

on:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and test web app
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk home-furniture-3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: home-furniture-3d-apk
          path: home-furniture-3d.apk

      # 휴대폰에서 바로 받을 수 있도록 최신 APK 를 'apk-latest' 사전 릴리스에 올린다
      - name: Update apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest home-furniture-3d.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "가구배치 3D APK (빌드 #${GITHUB_RUN_NUMBER})" \
            --notes "브랜치 ${GITHUB_REF_NAME}, 커밋 ${GITHUB_SHA::7} 에서 자동으로 만든 설치 파일입니다. 휴대폰에서 home-furniture-3d.apk 를 내려받아 설치하세요. (출처를 알 수 없는 앱 설치 허용 필요)"
